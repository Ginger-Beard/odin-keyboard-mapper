# OSRS profile: hat as function-key hotbar, left stick as arrow-key camera
# nudge. Everything else is explicitly NONE so extra pad buttons don't leak
# input into the game while the pad is grabbed.

hat.up      KEY_F1
hat.down    KEY_F2
hat.left    KEY_F3
hat.right   KEY_F4

ls.up       KEY_UP
ls.down     KEY_DOWN
ls.left     KEY_LEFT
ls.right    KEY_RIGHT

btn.south   NONE
btn.east    NONE
btn.north   NONE
btn.west    NONE
btn.tl      NONE
btn.tr      NONE
btn.tl2     NONE
btn.tr2     NONE
btn.select  NONE
btn.start   NONE
btn.mode    NONE
btn.thumbl  NONE
btn.thumbr  NONE

deadzone    0.5

# flip stick up/down (camera feel)
ls.invert_y 1

# zoom: hold left-stick click, tilt stick up/down
btn.thumbl+ls.up    WHEEL_UP
btn.thumbl+ls.down  WHEEL_DOWN
btn.thumbl+ls.left  NONE
btn.thumbl+ls.right NONE
wheel_repeat_ms 120
